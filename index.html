<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 7 Assignment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>CSS3 Transitions & Animations + JavaScript Functions</h1>

  <button id="hoverButton" class="hover-button">Hover Me!</button>

  <div class="box"></div>

  <button id="animateBtn">Animate Box</button>
  <div id="box" class="js-box"></div>

  <button id="startAnimation">Start Animation</button>
  <div id="circle"></div>

  <button id="pause">Pause</button>
  <button id="resume">Resume</button>
  <div id="movingBox"></div>

  <button id="openModal">Open Modal</button>
  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <p>Modal Content Here!</p>
    </div>
  </div>

  <form id="sampleForm">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
    <input type="submit" value="Submit">
    </form>
    <p id="formMessage"></p>

    <button id="save">Save to Local Storage</button>
    <button id="load">Load from Local Storage</button>
    <p id="storageMessage"></p>
    
  <script src="script.js"></script>
</body>
</html>
